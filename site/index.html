<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CONSTRUCT needles</title>
<meta name="description" content="How CONSTRUCT must look, view by view: the screenshots its test harness compares every build with.">
<style>
  /* The brand's palette (Construct-Linux/brand palette.toml): ground, surfaces, the ring that
     edges a raised surface, text, and the accent - for focus and the one thing that is active. */
  :root {
    --ground: #0b1116;
    --surface: #11181e;
    --raised: #172028;
    --ring: #2a3843;
    --text: #e6edf2;
    --muted: #93a4b0;
    --accent: #00e5ff;
    --accent-text: #00e5ff;
    --mask: rgba(255, 200, 87, 0.9);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --ground: #dee4e8;
      --surface: #f4f6f8;
      --raised: #ffffff;
      --ring: #c4ccd1;
      --text: #11181e;
      --muted: #536672;
      --accent: #00a2b4;
      --accent-text: #00646d;
      --mask: rgba(178, 102, 0, 0.9);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --ground: #dee4e8; --surface: #f4f6f8; --raised: #ffffff; --ring: #c4ccd1;
    --text: #11181e; --muted: #536672; --accent: #00a2b4; --accent-text: #00646d;
    --mask: rgba(178, 102, 0, 0.9); color-scheme: light;
  }
  :root[data-theme="dark"] { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--ground); color: var(--text); }
  body {
    font: 15px/1.45 "Adwaita Sans", Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent-text); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  header {
    position: sticky; top: 0; z-index: 2;
    background: color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--ring);
  }
  .bar {
    max-width: 1440px; margin: 0 auto; padding: 14px 24px;
    display: flex; gap: 16px; align-items: center; flex-wrap: wrap;
  }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.08em; margin: 0; }
  h1 span { font-weight: 400; letter-spacing: 0; color: var(--muted); }
  .build { color: var(--muted); font-size: 13px; }
  .tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  input[type="search"] {
    background: var(--surface); color: var(--text); border: 1px solid var(--ring);
    border-radius: 999px; padding: 7px 14px; font: inherit; width: 220px; max-width: 46vw;
  }
  button {
    font: inherit; color: var(--text); background: var(--surface);
    border: 1px solid var(--ring); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--raised); }
  button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent-text); }

  main { max-width: 1440px; margin: 0 auto; padding: 8px 24px 64px; }
  section h2 {
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--muted); margin: 28px 0 12px;
  }
  section h2 small { font-weight: 400; letter-spacing: 0; text-transform: none; }
  .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .card {
    display: block; padding: 0; text-align: left; border-radius: 12px; overflow: hidden;
    background: var(--surface); border: 1px solid var(--ring);
  }
  .card:hover { background: var(--surface); border-color: var(--muted); }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--ground); }
  .card .meta { padding: 9px 12px 11px; display: flex; justify-content: space-between; gap: 8px; }
  .card .name { font-size: 14px; overflow-wrap: anywhere; }
  .card .date { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .empty { color: var(--muted); padding: 48px 0; text-align: center; }

  /* The viewer: the view at its logical size (half its pixels, as a 2x screen shows it), or at
     1:1, where each of its pixels is one of the screen's - what sharpness is judged at. */
  dialog {
    width: 100vw; height: 100vh; max-width: none; max-height: none; margin: 0; padding: 0;
    border: 0; background: var(--ground); color: var(--text);
  }
  dialog::backdrop { background: var(--ground); }
  .vbar {
    position: sticky; top: 0; z-index: 2; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--ring);
  }
  .vbar .title { font-weight: 700; }
  .vbar .sub { color: var(--muted); font-size: 13px; }
  .vbar .spacer { flex: 1; }
  .stage { overflow: auto; height: calc(100vh - 54px); padding: 16px; }
  .frame { position: relative; margin: 0 auto; width: fit-content; }
  .frame img { display: block; border: 1px solid var(--ring); border-radius: 4px; image-rendering: auto; }
  .frame.fit img { height: auto; }
  .frame.one img { image-rendering: pixelated; }
  .region {
    position: absolute; border: 2px dashed var(--mask); border-radius: 3px; pointer-events: none;
  }
  .region span {
    position: absolute; left: 0; top: 100%; margin-top: 2px; white-space: nowrap;
    font-size: 11px; color: var(--ground); background: var(--mask); padding: 0 5px; border-radius: 3px;
  }
  .hidden { display: none !important; }

  @media (max-width: 600px) {
    .bar { padding: 12px 16px; }
    main { padding: 8px 16px 48px; }
    .tools { margin-left: 0; width: 100%; }
    input[type="search"] { flex: 1; max-width: none; }
    .grid { grid-template-columns: 1fr; }
  }

  .tolerance { color: var(--muted); font-size: 13px; }
  section > p.about { color: var(--muted); margin: -4px 0 14px; max-width: 82ch; }
  .card .meta { flex-direction: column; gap: 2px; }
  .card .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .card .what { font-size: 12.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--ring); color: var(--muted); white-space: nowrap; }
  .badge.new { border-color: var(--accent); color: var(--accent-text); }
  .badge.fail { border-color: #ff7a90; color: #ff7a90; }
  .vbody { display: grid; grid-template-columns: minmax(0, 1fr) 320px; height: calc(100vh - 54px); }
  .vbody .stage { height: auto; }
  aside {
    border-left: 1px solid var(--ring); background: var(--surface); overflow: auto;
    padding: 16px; font-size: 13.5px;
  }
  aside h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 0 6px; }
  aside h3:first-child { margin-top: 0; }
  aside dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; }
  aside dt { color: var(--muted); }
  aside dd { margin: 0; overflow-wrap: anywhere; }
  aside ul { margin: 0; padding-left: 18px; }
  .chip { display: inline-block; font-size: 12px; padding: 1px 7px; margin: 0 4px 4px 0; border: 1px solid var(--ring); border-radius: 999px; }
  /* Before and after: the previous needle under this one, the split where the slider is. */
  .frame .before { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .frame .before img { width: 100%; height: auto; border-radius: 4px; }
  .frame .split { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  input[type="range"] { width: 160px; accent-color: var(--accent); }
  @media (max-width: 900px) {
    .vbody { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    aside { border-left: 0; border-top: 1px solid var(--ring); max-height: 40vh; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>CONSTRUCT <span>needles</span></h1>
    <span class="build" id="build"></span>
    <span class="tolerance" id="tolerance"></span>
    <div class="tools">
      <input type="search" id="filter" placeholder="Filter views" aria-label="Filter views">
      <button id="theme" title="Light or dark page">Theme</button>
    </div>
  </div>
</header>
<main id="main"><p class="empty">Loading the views…</p></main>

<dialog id="viewer" aria-label="View">
  <div class="vbar">
    <span class="title" id="v-name"></span>
    <span class="sub" id="v-sub"></span>
    <span class="spacer"></span>
    <label class="sub" id="v-before-label" title="The needle this one replaced, under it (key b)">Before <input type="range" id="v-before" min="0" max="100" value="0"></label>
    <button id="v-scale" aria-pressed="false" title="1:1 shows each pixel of the screenshot as one of your screen's (key 1)">1:1</button>
    <button id="v-regions" aria-pressed="true" title="The regions the comparison leaves out (key r)">Regions</button>
    <button id="v-prev" aria-label="Previous view">←</button>
    <button id="v-next" aria-label="Next view">→</button>
    <button id="v-close" aria-label="Close">Close</button>
  </div>
  <div class="vbody">
    <div class="stage" id="v-stage" tabindex="-1" autofocus><div class="frame fit" id="v-frame"><img id="v-img" alt=""></div></div>
    <aside id="v-info"></aside>
  </div>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const THEMING = "https://github.com/Construct-Linux/brand/blob/main/THEMING.md";
  let data, shown = [], at = 0, oneToOne = false, regions = true;

  // A per-viewer convenience: the page's theme, remembered in this browser only.
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };
  const applyTheme = t => { if (t) document.documentElement.dataset.theme = t; };
  applyTheme(store.get("theme"));
  $("theme").onclick = () => {
    const dark = getComputedStyle(document.documentElement).colorScheme.includes("dark");
    const next = dark ? "light" : "dark";
    applyTheme(next); store.set("theme", next);
  };

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pct = x => `${(100 * x).toFixed(2)}%`;
  // How the view was approved: new, or the share of it that changed.
  const approval = v => v.approved.new ? ["new", `new in ${v.approved.build}`]
    : ["", v.approved.share == null ? `approved in ${v.approved.build}` : `${pct(v.approved.share)} changed in ${v.approved.build}`];

  const card = v => {
    const b = el("button", "card");
    const img = el("img"); img.loading = "lazy"; img.src = `${v.name}.png`; img.alt = v.name;
    const meta = el("div", "meta"), row = el("div", "row");
    row.append(el("span", "name", v.name));
    const [cls, text] = approval(v);
    row.append(el("span", "badge " + cls, cls ? "new" : v.scheme));
    if (v.lf.fail > 0) row.append(el("span", "badge fail", `${v.lf.fail} lf failed`));
    meta.append(row, el("span", "what", v.about));
    b.title = text;
    b.append(img, meta);
    b.onclick = () => open(shown.indexOf(v));
    return b;
  };

  const render = () => {
    const q = $("filter").value.trim().toLowerCase();
    const main = $("main");
    main.textContent = "";
    shown = [];
    for (const g of data.groups) {
      const vs = data.views.filter(v => v.group === g.key &&
        (v.name.toLowerCase().includes(q) || v.about.toLowerCase().includes(q) || v.rules.some(r => r.toLowerCase() === q)));
      if (!vs.length) continue;
      const s = el("section");
      const h = el("h2", null, g.title + " "); h.append(el("small", null, String(vs.length)));
      const grid = el("div", "grid");
      s.append(h, el("p", "about", g.about), grid);
      vs.forEach(v => { shown.push(v); grid.append(card(v)); });
      main.append(s);
    }
    if (!shown.length) main.innerHTML = `<p class="empty">No view matches.</p>`;
  };

  const info = v => {
    const a = $("v-info"); a.textContent = "";
    const sec = (title) => { a.append(el("h3", null, title)); };
    sec("What it validates");
    a.append(el("p", null, v.about));
    if (v.rules.length) {
      const p = el("p");
      v.rules.forEach(r => { const c = el("a", "chip", r); c.href = THEMING; c.target = "_blank"; c.rel = "noopener"; c.title = `THEMING.md, rule ${r}`; p.append(c); });
      a.append(p);
    }
    sec("How it was shot");
    const dl = el("dl");
    const row = (k, val) => { dl.append(el("dt", null, k), el("dd", null, val)); };
    const sc = v.screen;
    row("scheme", v.scheme);
    row("screen", `${sc.w}×${sc.h} px`);
    row("stage", `${sc.stage_w}×${sc.stage_h} at ${sc.scale * 100}%`);
    row("build", v.approved.build);
    row("os", v.approved.os.slice(0, 10));
    a.append(dl);
    sec("How it is compared");
    const t = data.tolerance;
    a.append(el("p", null, `A pixel differs past ${t.channel} of 255 in a channel; the view fails past ${pct(t.share)} of its compared area.`));
    sec("Approved");
    const [, text] = approval(v);
    const ap = el("p", null, text + " · ");
    const hist = el("a", null, "history"); hist.href = `https://github.com/${data.repository}/commits/main/${v.name}.png`; hist.target = "_blank"; hist.rel = "noopener";
    ap.append(hist);
    a.append(ap);
    sec("Look-and-feel checks");
    a.append(el("p", null, `${v.lf.pass} passed, ${v.lf.fail} failed`));
    if (v.lf.checks.length) { const ul = el("ul"); v.lf.checks.forEach(c => ul.append(el("li", null, c))); a.append(ul); }
    sec("Noise");
    a.append(el("p", null, `${pct(v.noise.edges)} of the pixels are edges; ${v.noise.palette_colors} of the palette's colours.`));
    sec(`Left out of the comparison (${v.regions.length})`);
    if (!v.regions.length) a.append(el("p", null, "Nothing: the whole view is compared."));
    else { const ul = el("ul"); v.regions.forEach(r => ul.append(el("li", null, `${r.why || "left out"} - ${r.w}×${r.h} at ${r.x},${r.y}`))); a.append(ul); }
  };

  const show = () => {
    const v = shown[at];
    $("v-name").textContent = v.name;
    $("v-sub").textContent = `${v.scheme} · ${v.screen.stage_w}×${v.screen.stage_h} @${v.screen.scale}x`;
    const frame = $("v-frame"), img = $("v-img");
    frame.className = "frame " + (oneToOne ? "one" : "fit");
    img.src = `${v.name}.png`;
    img.alt = v.name;
    // Fitted, a view is its stage's size - what a person sees on a screen at its scale; at 1:1,
    // each of its pixels is one of this screen's.
    if (oneToOne) {
      frame.style.width = "";
      img.style.width = `${v.screen.w / devicePixelRatio}px`;
    } else {
      frame.style.width = `min(${v.screen.stage_w}px, 100%)`;
      img.style.width = "100%";
    }
    frame.querySelectorAll(".region, .before, .split").forEach(r => r.remove());
    const before = $("v-before");
    $("v-before-label").classList.toggle("hidden", !v.prev);
    if (v.prev && +before.value > 0) {
      const b = el("div", "before"), bi = el("img"); bi.src = `prev/${v.name}.png`; bi.alt = `${v.name} before`;
      b.append(bi);
      b.style.clipPath = `inset(0 ${100 - before.value}% 0 0)`;
      const split = el("div", "split"); split.style.left = `${before.value}%`;
      frame.append(b, split);
    }
    if (regions) {
      for (const r of v.regions) {
        const d = el("div", "region");
        Object.assign(d.style, { left: `${100 * r.x / v.screen.w}%`, top: `${100 * r.y / v.screen.h}%`, width: `${100 * r.w / v.screen.w}%`, height: `${100 * r.h / v.screen.h}%` });
        d.append(el("span", null, r.why || "left out"));
        frame.append(d);
      }
    }
    info(v);
    $("v-scale").setAttribute("aria-pressed", oneToOne);
    $("v-regions").setAttribute("aria-pressed", regions);
    history.replaceState(null, "", `#${encodeURIComponent(v.name)}`);
  };

  const open = i => { at = i; $("v-before").value = 0; show(); if (!$("viewer").open) $("viewer").showModal(); };
  const step = d => { at = (at + d + shown.length) % shown.length; $("v-before").value = 0; show(); };
  $("v-prev").onclick = () => step(-1);
  $("v-next").onclick = () => step(1);
  $("v-close").onclick = () => $("viewer").close();
  $("v-scale").onclick = () => { oneToOne = !oneToOne; show(); };
  $("v-regions").onclick = () => { regions = !regions; show(); };
  $("v-before").addEventListener("input", show);
  $("viewer").addEventListener("close", () => history.replaceState(null, "", location.pathname));
  addEventListener("keydown", e => {
    if (!$("viewer").open) return;
    if (e.key === "ArrowRight") step(1);
    else if (e.key === "ArrowLeft") step(-1);
    else if (e.key === "1") { oneToOne = !oneToOne; show(); }
    else if (e.key === "r") { regions = !regions; show(); }
    else if (e.key === "b" && shown[at].prev) { const b = $("v-before"); b.value = +b.value > 0 ? 0 : 50; show(); }
  });
  $("filter").addEventListener("input", render);

  fetch("views.json").then(r => r.json()).then(d => {
    data = d;
    const c = d.commit;
    $("build").textContent = `${d.views.length} views · `;
    const link = el("a", null, `${c.subject} (${c.date})`); link.href = `https://github.com/${d.repository}/commit/${c.sha}`;
    $("build").append(link);
    $("tolerance").textContent = `fails past ${pct(d.tolerance.share)} changed, a pixel past ${d.tolerance.channel}/255`;
    render();
    const want = decodeURIComponent(location.hash.slice(1));
    const i = shown.findIndex(v => v.name === want);
    if (i >= 0) open(i);
  }).catch(err => { $("main").innerHTML = `<p class="empty">The views could not be read: ${err}</p>`; });
})();
</script>
</body>
</html>
